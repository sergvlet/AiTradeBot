# ==================================================
# AiTradeBot ? application-prod.properties (PROD)
# ??? ????? ENV (? ?????????)
# ==================================================

# ==================================================
# 0) PROFILES / BOOT
# ==================================================
spring.application.name=${APP_NAME:ai-trade-bot}
server.port=${SERVER_PORT:8080}
server.forward-headers-strategy=${SERVER_FORWARD_HEADERS_STRATEGY:framework}

server.error.include-message=${SERVER_ERROR_INCLUDE_MESSAGE:never}
server.error.include-exception=${SERVER_ERROR_INCLUDE_EXCEPTION:false}
server.error.include-stacktrace=${SERVER_ERROR_INCLUDE_STACKTRACE:never}

server.shutdown=${SERVER_SHUTDOWN:graceful}
spring.lifecycle.timeout-per-shutdown-phase=${SPRING_SHUTDOWN_TIMEOUT:30s}

# ==================================================
# 1) DATABASE (PostgreSQL)
# ==================================================
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/aitradebot}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:postgres}
spring.datasource.driver-class-name=${SPRING_DATASOURCE_DRIVER:org.postgresql.Driver}

spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX:20}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN_IDLE:5}
spring.datasource.hikari.idle-timeout=${DB_POOL_IDLE_TIMEOUT_MS:300000}
spring.datasource.hikari.max-lifetime=${DB_POOL_MAX_LIFETIME_MS:1800000}
spring.datasource.hikari.connection-timeout=${DB_POOL_CONN_TIMEOUT_MS:5000}

# ==================================================
# 2) JPA / HIBERNATE
# ==================================================
spring.jpa.open-in-view=${JPA_OPEN_IN_VIEW:false}
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:validate}
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=${JPA_FORMAT_SQL:false}

logging.level.org.hibernate.SQL=${LOG_HIBERNATE_SQL:OFF}
logging.level.org.hibernate.orm.jdbc.bind=${LOG_HIBERNATE_BIND:OFF}
logging.level.org.hibernate.tool.schema=${LOG_HIBERNATE_SCHEMA:INFO}

# ==================================================
# 3) FLYWAY
# ==================================================
spring.flyway.enabled=${FLYWAY_ENABLED:true}
spring.flyway.baseline-on-migrate=${FLYWAY_BASELINE_ON_MIGRATE:true}
spring.flyway.baseline-version=${FLYWAY_BASELINE_VERSION:0}
spring.flyway.baseline-description=${FLYWAY_BASELINE_DESC:baseline-existing-schema}

spring.flyway.locations=${FLYWAY_LOCATIONS:classpath:db/migration}
spring.flyway.default-schema=${FLYWAY_DEFAULT_SCHEMA:public}
spring.flyway.schemas=${FLYWAY_SCHEMAS:public}

spring.flyway.validate-on-migrate=${FLYWAY_VALIDATE_ON_MIGRATE:true}
spring.flyway.clean-disabled=${FLYWAY_CLEAN_DISABLED:true}

# ==================================================
# 4) LOGGING
# ==================================================
logging.level.root=${LOG_LEVEL_ROOT:INFO}
logging.level.com.chicu=${LOG_LEVEL_APP:INFO}

logging.level.org.springframework.web=${LOG_LEVEL_SPRING_WEB:INFO}
logging.level.org.springframework.web.filter.CommonsRequestLoggingFilter=${LOG_LEVEL_REQ_LOG_FILTER:OFF}
logging.level.org.springframework.web.servlet.mvc.method.annotation.RequestMappingHandlerMapping=${LOG_LEVEL_MAPPINGS:INFO}

logging.level.com.chicu.aitradebot.strategy.live=${LOG_LEVEL_STRATEGY_LIVE:INFO}
logging.level.com.chicu.aitradebot.market=${LOG_LEVEL_MARKET:INFO}
logging.level.com.chicu.aitradebot.exchange=${LOG_LEVEL_EXCHANGE:INFO}

# ==================================================
# 5) TELEGRAM
# ==================================================
telegram.bot.username=${TELEGRAM_BOT_USERNAME:AiTradeBot}
telegram.bot.token=${TELEGRAM_BOT_TOKEN:}

# ==================================================
# 6) ACTUATOR
# ==================================================
management.endpoints.web.exposure.include=${ACTUATOR_EXPOSE:health,info,prometheus}
management.endpoint.health.show-details=${ACTUATOR_HEALTH_DETAILS:never}

# ==================================================
# 7) THYMELEAF / STATIC
# ==================================================
spring.thymeleaf.prefix=${THYMELEAF_PREFIX:classpath:/templates/}
spring.thymeleaf.suffix=${THYMELEAF_SUFFIX:.html}
spring.thymeleaf.enabled=${THYMELEAF_ENABLED:true}

spring.web.resources.static-locations=${STATIC_LOCATIONS:classpath:/static/}
spring.web.resources.add-mappings=${STATIC_ADD_MAPPINGS:true}

# ==================================================
# 8) STRATEGY DEFAULTS
# ==================================================
strategy.defaults.exchange=${STRATEGY_DEFAULT_EXCHANGE:BINANCE}
strategy.defaults.network=${STRATEGY_DEFAULT_NETWORK:MAINNET}
strategy.defaults.symbol=${STRATEGY_DEFAULT_SYMBOL:BTCUSDT}
strategy.defaults.timeframe=${STRATEGY_DEFAULT_TIMEFRAME:1m}
strategy.defaults.minCandles=${STRATEGY_DEFAULT_MIN_CANDLES:50}
strategy.defaults.candles=${STRATEGY_DEFAULT_CANDLES:500}

# ==================================================
# 9) EXCHANGE BASE URLS
# ==================================================
exchange.binance.mainnet.baseUrl=${BINANCE_MAINNET_BASE_URL:https://api.binance.com}
exchange.binance.testnet.baseUrl=${BINANCE_TESTNET_BASE_URL:https://testnet.binance.vision}

exchange.bybit.mainnet.baseUrl=${BYBIT_MAINNET_BASE_URL:https://api.bybit.com}
exchange.bybit.testnet.baseUrl=${BYBIT_TESTNET_BASE_URL:https://api-testnet.bybit.com}

exchange.okx.mainnet.baseUrl=${OKX_MAINNET_BASE_URL:https://www.okx.com}
exchange.okx.testnet.baseUrl=${OKX_TESTNET_BASE_URL:https://www.okx.com}

# ==================================================
# 10) HTTP CLIENT POOL / TIMEOUTS
# ==================================================
app.http.pool.max-total=${HTTP_POOL_MAX_TOTAL:200}
app.http.pool.max-per-route=${HTTP_POOL_MAX_PER_ROUTE:50}
app.http.pool.validate-after-inactivity-ms=${HTTP_POOL_VALIDATE_AFTER_INACTIVITY_MS:2000}

app.http.timeout.connect-ms=${HTTP_TIMEOUT_CONNECT_MS:3000}
app.http.timeout.request-ms=${HTTP_TIMEOUT_REQUEST_MS:3000}
app.http.timeout.response-ms=${HTTP_TIMEOUT_RESPONSE_MS:12000}

# ==================================================
# 11) MARKET DISPATCH
# ==================================================
market.dispatch.min-interval-ms=${MARKET_DISPATCH_MIN_INTERVAL_MS:0}
market.dispatch.logEverySeq=${MARKET_DISPATCH_LOG_EVERY_SEQ:50}
market.dispatch.logFirstSeq=${MARKET_DISPATCH_LOG_FIRST_SEQ:5}
market.dispatch.inactiveTtlMs=${MARKET_DISPATCH_INACTIVE_TTL_MS:60000}

# ==================================================
# 12) WINDOW SCALPING (runtime)
# ==================================================
strategy.window.settingsRefreshSeconds=${WINDOW_SETTINGS_REFRESH_SECONDS:10}
strategy.window.settingsVersionCheckMs=${WINDOW_SETTINGS_VERSION_CHECK_MS:1000}

strategy.window.tickLogEveryTicks=${WINDOW_TICK_LOG_EVERY_TICKS:800}
strategy.window.holdThrottleMs=${WINDOW_HOLD_THROTTLE_MS:2500}

strategy.window.mlEnabled=${WINDOW_ML_ENABLED:false}
strategy.window.mlFailOpen=${WINDOW_ML_FAIL_OPEN:true}
strategy.window.mlMinProba=${WINDOW_ML_MIN_PROBA:0.60}

strategy.window.autoTuneOnHold=${WINDOW_AUTOTUNE_ON_HOLD:true}
strategy.window.autoTuneHoldCooldownSeconds=${WINDOW_AUTOTUNE_HOLD_COOLDOWN_SECONDS:60}
strategy.window.autoTuneHoldReasons=${WINDOW_AUTOTUNE_HOLD_REASONS:range_too_small,windowSize<5,no_settings,window_invalid,range_zero,pos_invalid}

strategy.window.coarseAdjustEnabled=${WINDOW_COARSE_ADJUST_ENABLED:true}
strategy.window.coarseAdjustAfterConsecutive=${WINDOW_COARSE_ADJUST_AFTER_CONSECUTIVE:6}
strategy.window.coarseAdjustCooldownSeconds=${WINDOW_COARSE_ADJUST_COOLDOWN_SECONDS:120}
strategy.window.coarseAdjustFactor=${WINDOW_COARSE_ADJUST_FACTOR:0.85}
strategy.window.coarseAdjustMinFloorPct=${WINDOW_COARSE_ADJUST_MIN_FLOOR_PCT:0.02}

# ==================================================
# 13) ML (Python sidecar)
# ==================================================
ml.enabled=${ML_ENABLED:true}
ml.base-url=${ML_BASE_URL:http://127.0.0.1:8002}
ml.api-key=${ML_API_KEY:}
ml.connect-timeout-ms=${ML_CONNECT_TIMEOUT_MS:1000}
ml.read-timeout-ms=${ML_READ_TIMEOUT_MS:8000}
ml.health-startup-log-level=${ML_HEALTH_LOG_LEVEL:WARN}

# ==================================================
# 14) ML STORAGE (Java-side dirs)
# ==================================================
ml.storage.models-dir=${ML_MODELS_DIR:./ml-models}
ml.storage.data-dir=${ML_DATA_DIR:./ml-data}
