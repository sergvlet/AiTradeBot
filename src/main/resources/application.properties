# ==================================================
# AiTradeBot — application.properties (DEFAULT / DEV)
# ==================================================

spring.flyway.enabled=true

# ==================================================
# 1) APP / SERVER
# ==================================================
spring.application.name=ai-trade-bot
server.port=8080
server.forward-headers-strategy=framework

server.error.include-message=never
server.error.include-exception=false
server.error.include-stacktrace=never

server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=30s

# ==================================================
# 2) DATABASE (PostgreSQL)
# ==================================================
spring.datasource.url=jdbc:postgresql://localhost:5432/aitradebot
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver

spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.connection-timeout=5000

# ==================================================
# 3) JPA / HIBERNATE
# ==================================================
spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

logging.level.org.hibernate.SQL=OFF
logging.level.org.hibernate.orm.jdbc.bind=OFF
logging.level.org.hibernate.tool.schema=INFO

# ==================================================
# 4) FLYWAY
# ==================================================
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0
spring.flyway.baseline-description=baseline-existing-schema
spring.flyway.locations=classpath:db/migration
spring.flyway.default-schema=public
spring.flyway.schemas=public
spring.flyway.validate-on-migrate=true
spring.flyway.clean-disabled=true

# ==================================================
# 5) LOGGING
# ==================================================
logging.level.root=INFO
logging.level.com.chicu=INFO
logging.level.com.chicu.aitradebot.trade=INFO
logging.level.com.chicu.aitradebot.strategy.live=INFO
logging.level.com.chicu.aitradebot.market=INFO
logging.level.com.chicu.aitradebot.exchange=INFO

# ==================================================
# 6) TELEGRAM
# ==================================================
telegram.bot.username=AiTradeBot
telegram.bot.token=

# ==================================================
# 7) ACTUATOR
# ==================================================
management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.show-details=never

# ==================================================
# 8) THYMELEAF / STATIC
# ==================================================
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.enabled=true

spring.web.resources.static-locations=classpath:/static/
spring.web.resources.add-mappings=true

# ==================================================
# 9) STRATEGY DEFAULTS
# ==================================================
strategy.defaults.exchange=BINANCE
strategy.defaults.network=MAINNET
strategy.defaults.symbol=BTCUSDT
strategy.defaults.timeframe=1m
strategy.defaults.minCandles=50
strategy.defaults.candles=500

# ==================================================
# 10) EXCHANGE BASE URLS
# ==================================================
exchange.binance.mainnet.baseUrl=https://api.binance.com
exchange.binance.testnet.baseUrl=https://testnet.binance.vision

exchange.bybit.mainnet.baseUrl=https://api.bybit.com
exchange.bybit.testnet.baseUrl=https://api-testnet.bybit.com

exchange.okx.mainnet.baseUrl=https://www.okx.com
exchange.okx.testnet.baseUrl=https://www.okx.com

# ==================================================
# 11) HTTP CLIENT POOL / TIMEOUTS
# ==================================================
app.http.pool.max-total=200
app.http.pool.max-per-route=50
app.http.pool.validate-after-inactivity-ms=2000

app.http.timeout.connect-ms=3000
app.http.timeout.request-ms=3000
app.http.timeout.response-ms=12000

# ==================================================
# 12) MARKET DISPATCH
# ==================================================
market.dispatch.min-interval-ms=0
market.dispatch.logEverySeq=50
market.dispatch.logFirstSeq=5
market.dispatch.inactiveTtlMs=60000

# ==================================================
# 13) WINDOW SCALPING (runtime)
# ==================================================
strategy.window.settingsRefreshSeconds=10
strategy.window.settingsVersionCheckMs=1000
strategy.window.tickLogEveryTicks=800
strategy.window.holdThrottleMs=2500

strategy.window.mlEnabled=true
strategy.window.mlFailOpen=true
strategy.window.mlMinProba=0.60

strategy.window.autoTuneOnHold=true
strategy.window.autoTuneHoldCooldownSeconds=60
strategy.window.autoTuneHoldReasons=range_too_small,windowSize<5,no_settings,window_invalid,range_zero,pos_invalid

strategy.window.coarseAdjustEnabled=true
strategy.window.coarseAdjustAfterConsecutive=6
strategy.window.coarseAdjustCooldownSeconds=120
strategy.window.coarseAdjustFactor=0.85
strategy.window.coarseAdjustMinFloorPct=0.02

# ==================================================
# 14) ML (Python service)
# ==================================================
ml.enabled=true
ml.base-url=http://127.0.0.1:8002
ml.connect-timeout-ms=1000
ml.read-timeout-ms=8000
ml.health-startup-log-level=INFO

# строгий режим: падаем если нет ML/модели
ml.failFast=true
ml.requireModel=true

# ==================================================
# 14.1) ML SIDECAR
# ==================================================
ml.sidecar.enabled=true
ml.sidecar.python=${user.dir}/.venv/Scripts/python.exe
ml.sidecar.module=app.app:app
ml.sidecar.host=127.0.0.1
ml.sidecar.port=8002
ml.sidecar.workDir=${user.dir}

ml.storage.models-dir=${user.dir}/ml-models
ml.storage.data-dir=${user.dir}/ml-data

ml.sidecar.modelsDir=${ml.storage.models-dir}
ml.sidecar.modelPath=${ml.storage.models-dir}/model.joblib
ml.sidecar.startTimeoutMs=15000
ml.sidecar.pollEveryMs=250

# ==================================================
# 15) ML TRAIN
# ==================================================
ml.train.enabled=true
ml.train.minSamples=500
ml.train.lookbackDays=14
ml.train.cooldownMinutes=30
ml.train.autoApply=true

# ==================================================
# 16) TRADE (ВАЖНО)
# ==================================================
# true  = PAPER разрешён только на TESTNET (безопасно)
# false = PAPER можно и на MAINNET (реальные ордера при MAINNET!)
trade.paperBlocksRealOrders=false

# троттлинг логов "почему вход/выход отклонён"
trade.rejectCooldownMs=15000