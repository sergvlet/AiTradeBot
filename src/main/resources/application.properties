# ==================================================
# AiTradeBot — application.properties
# ==================================================
# Правила (чтобы не было “магии” и вечных багов):
# 1) Один смысл — один ключ (без дублей разных префиксов)
# 2) Глобальные флаги сверху: включено/выключено
# 3) Комментарии объясняют “что менять и зачем”, рядом с ключом
# ==================================================


# ==================================================
# 1) ОСНОВНОЕ
# ==================================================
spring.application.name=ai-trade-bot
server.port=8080


# ==================================================
# 2) DATABASE (PostgreSQL)
# ==================================================
spring.datasource.url=jdbc:postgresql://localhost:5432/aitradebot
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver


# ==================================================
# 3) JPA / HIBERNATE
# ==================================================
spring.jpa.open-in-view=false

# create  — только на пустой базе (удалит/пересоздаст)
# update  — обычная разработка (подстраивает схему)
spring.jpa.hibernate.ddl-auto=update

# SQL в логах выключен (иначе будет спам)
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# Не логируем SQL/бинды (ещё меньше спама)
logging.level.org.hibernate.SQL=OFF
logging.level.org.hibernate.orm.jdbc.bind=OFF

# Чуть меньше шума от schema update
logging.level.org.hibernate.tool.schema=INFO


# ==================================================
# 4) FLYWAY (временно отключено)
# ==================================================
spring.flyway.enabled=false


# ==================================================
# 5) ЛОГИРОВАНИЕ (общие уровни)
# ==================================================
logging.level.root=INFO
logging.level.com.chicu=INFO

# Spring Web — только важное
logging.level.org.springframework.web=INFO
logging.level.org.springframework.web.filter.CommonsRequestLoggingFilter=OFF
logging.level.org.springframework.web.servlet.mvc.method.annotation.RequestMappingHandlerMapping=INFO

# Модули проекта (без спама)
logging.level.com.chicu.aitradebot.strategy.live=INFO
logging.level.com.chicu.aitradebot.market=INFO
logging.level.com.chicu.aitradebot.exchange=INFO


# ==================================================
# 6) TELEGRAM
# ==================================================
telegram.bot.username=AiTradeBot
telegram.bot.token=YOUR_TELEGRAM_TOKEN_HERE


# ==================================================
# 7) ACTUATOR
# ==================================================
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=always


# ==================================================
# 8) THYMELEAF / STATIC
# ==================================================
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.enabled=true

spring.web.resources.static-locations=classpath:/static/
spring.web.resources.add-mappings=true


# ==================================================
# 9) EXCHANGE BASE URLS
# ==================================================
exchange.binance.mainnet.baseUrl=https://api.binance.com
exchange.binance.testnet.baseUrl=https://testnet.binance.vision

exchange.bybit.mainnet.baseUrl=https://api.bybit.com
exchange.bybit.testnet.baseUrl=https://api-testnet.bybit.com

exchange.okx.mainnet.baseUrl=https://www.okx.com
exchange.okx.testnet.baseUrl=https://www.okx.com


# ==================================================
# 10) HTTP CLIENT POOL / TIMEOUTS
# ==================================================
# Пул (общий для HTTP клиентов приложения)
app.http.pool.max-total=200
app.http.pool.max-per-route=50
app.http.pool.validate-after-inactivity-ms=2000

# Таймауты (общие)
app.http.timeout.connect-ms=3000
app.http.timeout.request-ms=3000
app.http.timeout.response-ms=12000


# ==================================================
# 11) MARKET DISPATCH (throttle + диагностика)
# ==================================================
# Минимальный интервал между onPriceUpdate в оркестратор
market.dispatch.min-interval-ms=0

# Диагностика: печатать каждые N seq и первые N seq
market.dispatch.logEverySeq=50
market.dispatch.logFirstSeq=5

# TTL для ключей throttling, когда стратегия не активна
market.dispatch.inactiveTtlMs=60000


# ==================================================
# 12) WINDOW SCALPING (runtime)
# ==================================================
# Как часто стратегия перечитывает настройки из БД
strategy.window.settingsRefreshSeconds=10

# Логи тиков: 20 — отладка, 800 — спокойнее (меньше спама)
strategy.window.tickLogEveryTicks=20

# Ограничение частоты HOLD-сигналов, чтобы не засыпать UI
strategy.window.holdThrottleMs=2500

# Использовать ML-фильтр именно в WindowScalpingStrategy:
# - true  → стратегия будет спрашивать ML (predict) перед входом
# - false → стратегия торгует без ML (чтобы торговля не “умирала”, если ML не поднят)
strategy.window.mlEnabled=false

# Минимальная вероятность (0..1) для “разрешения входа” от ML
strategy.window.mlMinProba=0.60


# ==================================================
# 13) ML (Python XGBoost service on :8001) — ЕДИНЫЙ ИСТОЧНИК НАСТРОЕК
# ==================================================
# ГЛОБАЛЬНОЕ ВКЛЮЧЕНИЕ ML:
# - true  → приложение будет проверять /health и использовать /predict (если стратегия включила mlEnabled=true)
# - false → MlHealthProbe НЕ будет писать “NOT available”, и ML-ветка не будет мешать торговле
ml.enabled=false
# Один URL на весь ML (и для /health, и для /predict)
ml.base-url=http://127.0.0.1:8001

# (опционально) ключ для защиты ML сервиса (можно оставить пустым)
ml.api-key=

# Таймауты именно ML клиента (чтобы не зависать, если python подвис/упал)
ml.connect-timeout-ms=1000
ml.read-timeout-ms=8000

# Как логировать стартовую проверку ML:
# WARN  — видно в консоли, но не валит приложение
# DEBUG — почти тишина
ml.health.startupLogLevel=WARN


# ==================================================
# 14) ML STORAGE
# ==================================================
ml.storage.models-dir=./ml-models
ml.storage.data-dir=./ml-data


# ==================================================
# 15) ML / AI BACKTEST RUNNER (warmup, candles)
# ==================================================
ai.ml.backtest.warmup-ttl-ms=60000
ai.ml.backtest.warmup-multiplier=2.0
ai.ml.backtest.warmup-min=500
ai.ml.backtest.warmup-max=20000

ai.ml.backtest.default-candles-limit=900
ai.ml.backtest.candles-limit-min=50
ai.ml.backtest.candles-limit-max=20000

ai.ml.backtest.log-warmup-info=true


# ==================================================
# 16) AUTO TUNING (общие) — ЕДИНЫЙ ПРЕФИКС
# ==================================================
# Было: ml.tuning.*  → стало: aitrade.ai.tuning.* (единый namespace)
aitrade.ai.tuning.initial-candidates=30
aitrade.ai.tuning.seed=42

# Guard — защита от “безумных” изменений
aitrade.ai.tuning.guard.enabled=true
aitrade.ai.tuning.guard.min-hours-between=6
aitrade.ai.tuning.guard.max-delta-pct=0.25
aitrade.ai.tuning.guard.require-tp-gte-sl=true

# Сколько кандидатов реально прогонять после Guard
aitrade.ai.tuning.eval.max-candidates=10

# Веса скоринга (profit/drawdown/trades)
aitrade.ai.tuning.score.profit-weight=1.0
aitrade.ai.tuning.score.dd-weight=1.5
aitrade.ai.tuning.score.trades-weight=0.05


# ==================================================
# 17) AUTO TUNING — WINDOW_SCALPING (prod)
# ==================================================
aitrade.ai.tuning.window-scalping.model-version=ws-tuner-v1
aitrade.ai.tuning.window-scalping.candidates=40

# Минимальные улучшения
aitrade.ai.tuning.window-scalping.min-abs-improve=0.02
aitrade.ai.tuning.window-scalping.min-rel-improve=0.03

# “База слишком плохая” — режим спасения
aitrade.ai.tuning.window-scalping.baseline-too-bad-score=-1.00
aitrade.ai.tuning.window-scalping.baseline-too-bad-min-delta=0.01

# Период и свечи
aitrade.ai.tuning.window-scalping.default-period-days=14
aitrade.ai.tuning.window-scalping.min-candles-limit=50
aitrade.ai.tuning.window-scalping.default-candles-limit=500

# Warmup
aitrade.ai.tuning.window-scalping.warmup-multiplier=2
aitrade.ai.tuning.window-scalping.min-warmup-limit=500
aitrade.ai.tuning.window-scalping.max-warmup-limit=20000

# Числовая стабильность
aitrade.ai.tuning.window-scalping.epsilon=0.0001

# Логи пропусков (если false — пропуски уходят в DEBUG и меньше мешают)
aitrade.ai.tuning.window-scalping.log-skip-as-info=false


# ==================================================
# 18) Прочее
# ==================================================
# Было: ai.tuning.autosave.ttlMs (camelCase) → стало kebab-case + единый prefix
aitrade.ai.tuning.autosave.ttl-ms=30000


# Автотюнер (рантайм)
ai.autotune.periodicInitialDelayMinutes=1
ai.autotune.periodicEveryHours=6

# Какие фазы пропускаем (если у тебя runPhase=BACKTEST и ты хочешь ТЮНИТЬ — убери BACKTEST!)
ai.autotune.skipPhases=COLLECT,BACKTEST

# debounce
ai.autotune.defaultDebounceSeconds=120
ai.autotune.minDebounceMillis=30000
