# ==================================================
# AiTradeBot — application.properties (DEFAULT / DEV)
# Логика приоритета:
# 1) данные и фильтры с биржи
# 2) настройки из БД
# 3) дефолты из этого файла, если в БД пусто
# ==================================================

# ==================================================
# APP / SERVER
# ==================================================
spring.application.name=ai-trade-bot
server.port=8080
server.forward-headers-strategy=framework

server.error.include-message=never
server.error.include-exception=false
server.error.include-stacktrace=never
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=30s

# UTF-8
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.enabled=true
server.servlet.encoding.force=true
server.tomcat.uri-encoding=UTF-8
spring.messages.encoding=UTF-8
spring.banner.charset=UTF-8
logging.charset.console=UTF-8
logging.charset.file=UTF-8

# ==================================================
# DATABASE (PostgreSQL)
# ==================================================
spring.datasource.url=jdbc:postgresql://localhost:5432/aitradebot
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver

spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.connection-timeout=5000

# ==================================================
# JPA / HIBERNATE
# ==================================================
spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

logging.level.org.hibernate.SQL=OFF
logging.level.org.hibernate.orm.jdbc.bind=OFF
logging.level.org.hibernate.tool.schema=INFO

# ==================================================
# FLYWAY
# ==================================================
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0
spring.flyway.baseline-description=baseline-existing-schema
spring.flyway.locations=classpath:db/migration
spring.flyway.default-schema=public
spring.flyway.schemas=public
spring.flyway.validate-on-migrate=true
spring.flyway.clean-disabled=true

# ==================================================
# LOGGING
# ==================================================
logging.level.root=INFO
logging.level.com.chicu.aitradebot=INFO
logging.level.com.chicu.aitradebot.trade=INFO
logging.level.com.chicu.aitradebot.strategy.live=INFO
logging.level.com.chicu.aitradebot.strategy.scalping=INFO
logging.level.com.chicu.aitradebot.strategy.windowscalping=INFO
logging.level.com.chicu.aitradebot.market=INFO
logging.level.com.chicu.aitradebot.market.stream=INFO
logging.level.com.chicu.aitradebot.exchange=INFO
logging.level.com.chicu.aitradebot.exchange.binance.ws=INFO
logging.level.com.chicu.aitradebot.exchange.bybit=INFO
logging.level.com.chicu.aitradebot.ai.ml=INFO

# ==================================================
# TELEGRAM
# ==================================================
telegram.bot.username=AiTradeBot
telegram.bot.token=

# ==================================================
# ACTUATOR
# ==================================================
management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.show-details=never

# ==================================================
# THYMELEAF / STATIC
# ==================================================
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.enabled=true
spring.thymeleaf.cache=false

spring.web.resources.static-locations=classpath:/static/
spring.web.resources.add-mappings=true
spring.web.resources.chain.cache=false
spring.web.resources.cache.period=0

# ==================================================
# STRATEGY DEFAULTS
# Используются только если в БД нет значений
# ==================================================
strategy.defaults.exchange=BINANCE
strategy.defaults.network=TESTNET
strategy.defaults.symbol=BTCUSDT
strategy.defaults.timeframe=1m
strategy.defaults.minCandles=50
strategy.defaults.candles=1400

# ==================================================
# EXCHANGE BASE URLS
# ==================================================
exchange.binance.mainnet.baseUrl=https://api.binance.com
exchange.binance.testnet.baseUrl=https://testnet.binance.vision

exchange.bybit.mainnet.baseUrl=https://api.bybit.com
exchange.bybit.testnet.baseUrl=https://api-testnet.bybit.com

exchange.okx.mainnet.baseUrl=https://www.okx.com
exchange.okx.testnet.baseUrl=https://www.okx.com

# ==================================================
# BINANCE WS
# ==================================================
exchange.binance.ws.reconnect.enabled=true
exchange.binance.ws.reconnect.initialDelayMs=1000
exchange.binance.ws.reconnect.maxDelayMs=30000
exchange.binance.ws.reconnect.jitterMs=350
exchange.binance.ws.reconnect.maxAttempts=0

exchange.binance.ws.staleCheck.enabled=true
exchange.binance.ws.staleCheck.periodMs=15000
exchange.binance.ws.staleCheck.maxSilenceMs=90000
exchange.binance.ws.staleCheck.kline.maxSilenceMs.mainnet=90000
exchange.binance.ws.staleCheck.kline.maxSilenceMs.testnet=120000
exchange.binance.ws.staleCheck.fast.maxSilenceMs.mainnet=45000
exchange.binance.ws.staleCheck.fast.maxSilenceMs.testnet=75000
exchange.binance.ws.staleCheck.fast.suppressByContextActivity=true

exchange.binance.ws.bookTicker.minEmitIntervalMs=100
exchange.binance.ws.bookTicker.emitOnlyOnPriceChange=true
exchange.binance.ws.bookTicker.forwardWhenNoAggTradeMs=100
exchange.binance.ws.bookTicker.forwardAsSyntheticTick=false

# ==================================================
# BYBIT WS
# ==================================================
exchange.bybit.ws.reconnect.enabled=true
exchange.bybit.ws.reconnect.delayMs=1500

# ==================================================
# HTTP CLIENT POOL / TIMEOUTS
# ==================================================
app.http.pool.max-total=200
app.http.pool.max-per-route=50
app.http.pool.validate-after-inactivity-ms=2000

app.http.timeout.connect-ms=3000
app.http.timeout.request-ms=3000
app.http.timeout.response-ms=12000

# ==================================================
# MARKET DISPATCH
# Для WindowScalping не 0, чтобы не было лишнего шума
# и слишком частых вызовов стратегии/ML
# ==================================================
market.dispatch.min-interval-ms=250
market.dispatch.logEverySeq=200
market.dispatch.logFirstSeq=5
market.dispatch.inactiveTtlMs=60000
market.dispatch.skip-log-cooldown-ms=30000

# Формирование UI-свечи
market.ui.candle-interval-ms=300

# KLINE -> PRICE dispatch
market.dispatch.kline-price.enabled=true
market.dispatch.kline-price.min-interval-ms=250

# Guard
market.dispatch.skip-when-degraded=true

# ==================================================
# MARKET FAST CHANNEL / HEALTH
# Для WindowScalping лучше отключить bookTicker:
# основная цена должна идти через AGG_TRADE
# ==================================================
market.stream.bookTicker.enabled=false
market.stream.bookTicker.windowScalping.enabled=false
market.stream.health.requireFastChannel=true
market.stream.health.maxSilenceMs=45000
market.stream.health.fastChannelWarmupMs=12000
market.stream.lateKline.logThrottleMs=15000
market.stream.lateKline.sampleEvery=100
# ==================================================
# WINDOW SCALPING (runtime)
# ==================================================
strategy.window.settingsRefreshSeconds=10
strategy.window.settingsVersionCheckMs=1000
strategy.window.tickLogEveryTicks=800
strategy.window.holdThrottleMs=2500
strategy.window.entryBlockLogThrottleMs=5000

# Anti-spam для восстановления позиции / dust
strategy.window.restoreRetryCooldownMs=30000
strategy.window.dustRestoreLogThrottleMs=300000
strategy.window.positionSyncMinIntervalMs=30000

# ---------------- fast exit ----------------
strategy.window.fastExitEnabled=true
strategy.window.fastExitMinNetPct=0.12
strategy.window.fastExitMinPosPct=0.82
strategy.window.fastExitRequireHighZone=false
strategy.window.fastExitMinHoldMs=2500

# ---------------- ML gate ----------------
strategy.window.mlEnabled=true
strategy.window.mlFailOpen=true
strategy.window.mlMinProba=0.16
strategy.window.mlPredictThrottleMs=1200
strategy.window.mlLogThrottleMs=15000
strategy.window.mlBelowThresholdCooldownMs=2500
strategy.window.mlRecheckMinPriceMovePct=0.03

# ---------------- adaptive ML gate ----------------
strategy.window.adaptiveMlGateEnabled=true
strategy.window.adaptiveMlGateOnlyHybrid=false
strategy.window.adaptiveMlGateSampleSize=64
strategy.window.adaptiveMlGateQuantile=0.75
strategy.window.adaptiveMlGateMarginPct=0.015
strategy.window.adaptiveMlGateFloor=0.06
strategy.window.adaptiveMlGateMaxThresholdDrop=0.45
strategy.window.adaptiveMlGateMinStrongScore=12.0

# ---------------- low-confidence auto-tune ----------------
strategy.window.mlAutoTuneOnLowConfidence=true
strategy.window.mlAutoTuneLowConfidenceAfter=3

# ---------------- auto-tune on hold ----------------
strategy.window.autoTuneOnHold=true
strategy.window.autoTuneHoldCooldownSeconds=60
strategy.window.autoTuneHoldReasons=range_too_small,windowSize<5,no_settings,window_invalid,range_zero,pos_invalid,no_room_to_high,ml_below_threshold,predict_failed

# ---------------- coarse adjust ----------------
strategy.window.coarseAdjustEnabled=true
strategy.window.coarseAdjustAfterConsecutive=3
strategy.window.coarseAdjustCooldownSeconds=120
strategy.window.coarseAdjustFactor=0.80
strategy.window.coarseAdjustMinFloorPct=0.0006

# ---------------- auto min-range ----------------
strategy.window.autoMinRangeEnabled=true
strategy.window.autoMinRangeEverySeconds=30
strategy.window.autoMinRangeSampleSize=360
strategy.window.autoMinRangeQuantile=0.15
strategy.window.autoMinRangeMarginFactor=0.70
strategy.window.autoMinRangeMinFloorPct=0.0004
strategy.window.autoMinRangeMaxCapPct=0.15
strategy.window.autoMinRangeMinSamples=60
strategy.window.autoMinRangeMinDelta=0.0002

# ---------------- noise filter / risk ----------------
strategy.window.noiseFilterEnabled=true
strategy.window.entryBounceMinPosPctOfRange=0.7
strategy.window.minMomentum1Pct=0.0003
strategy.window.minVolatilityPct=0.0010
strategy.window.minWindowReturnPct=-0.40

strategy.window.dynamicTpEnabled=true
strategy.window.dynamicTpMinPct=0.06
strategy.window.dynamicTpMaxPct=0.45
strategy.window.dynamicSlMinPct=0.02
strategy.window.dynamicSlMaxPct=0.14
strategy.window.dynamicTpFromRangeFactor=0.38
strategy.window.dynamicSlFromRangeFactor=0.16
strategy.window.dynamicMinRiskReward=0.75
strategy.window.minProfitAfterFeesPct=0.03

strategy.window.breakEvenEnabled=true
strategy.window.breakEvenTriggerToTpRatio=0.18
strategy.window.breakEvenOffsetPct=0.02

# ==================================================
# ML (Python service)
# ==================================================
ml.enabled=true
ml.base-url=http://127.0.0.1:8002
ml.connect-timeout-ms=1000
ml.read-timeout-ms=8000
ml.health-startup-log-level=INFO

# В dev лучше не валить всё приложение,
# если модель будет создана bootstrap-ом
ml.failFast=false
ml.requireModel=false

# ==================================================
# ML SIDECAR
# ==================================================
ml.sidecar.enabled=true
ml.sidecar.python=${user.dir}/.venv/Scripts/python.exe
ml.sidecar.module=app.app:app
ml.sidecar.host=127.0.0.1
ml.sidecar.port=8002
ml.sidecar.workDir=${user.dir}

ml.storage.models-dir=${user.dir}/ml-models
ml.storage.data-dir=${user.dir}/ml-data

ml.sidecar.modelsDir=${ml.storage.models-dir}
ml.sidecar.modelPath=${ml.storage.models-dir}/model.joblib
ml.sidecar.startTimeoutMs=30000
ml.sidecar.pollEveryMs=250

# ==================================================
# ML TRAIN
# Стартуем раньше, чтобы новые пары не ждали слишком долго
# ==================================================
ml.train.enabled=true
ml.train.minSamples=90
ml.train.lookbackDays=30
ml.train.prepareMinSamples=60
ml.train.cooldownMinutes=10
ml.train.autoApply=true

# ==================================================
# TRADE
# ==================================================
# На mainnet реальные ордера не блокируются paper-режимом
trade.paperBlocksRealOrders=false

# Legacy alias на случай старого биндинга в других классах
trade.paper.blocksRealOrders=false

trade.rejectCooldownMs=30000

# Legacy-флаг: только для мягкой диагностики
trade.entry.block-all-mode-without-explicit-capital-value=true

# Минимальная чистая прибыль после комиссий в валюте котировки
trade.entry.min-net-profit-quote=0.10

# Автоматически поднять TP, если текущего TP не хватает для чистой прибыли
trade.entry.auto-bump-tp-to-net-profit=true

# Дополнительный буфер сверх round-trip комиссии, в процентах
trade.entry.extra-fee-buffer-pct=0.02

# Верхний лимит для авто-поднятого TP
trade.entry.max-auto-bumped-tp-pct=5.00

# Максимум, во сколько раз можно поднять requested TP

# Если requested TP заведомо ниже floor по комиссиям — вход блокируется

# Restore / dust anti-spam для TradeExecutionServiceImpl
trade.position-restore.drop-dust=true
trade.position-restore.min-notional=5.00
trade.position-restore.retry-cooldown-ms=30000
trade.position-restore.dust-log-throttle-ms=300000
trade.position-restore.dust-suppress-ms=21600000

# Ослабленные runtime-пороги WindowScalping для live-рынка
strategy.window.minEntryScoreToEnter=2.0
strategy.window.minEntryScoreWithoutMl=3.0
strategy.window.rangeTooSmallBypassFactor=0.45
strategy.window.rangeTooSmallBypassAbsoluteGapPct=0.020
strategy.window.lowZoneExpandInMicroRangeFactor=2.50
strategy.window.lowZoneExpandInMicroRangeMaxPct=48.0
strategy.window.minRoomToWindowHighPct=0.004
strategy.window.tpRoomUsagePct=0.88
strategy.window.minRoomNetRewardRisk=0.08
strategy.window.windowHighProjectionPctOfRange=3.20
strategy.window.minNetRewardRiskForMarket=0.35
strategy.window.prepareValidationSplitPct=20
strategy.window.prepareMinCandles=120
trade.fee.use-cached-when-unavailable=true
trade.fee.fallback-taker-pct=0.18


# ==================================================
# LOG CLEANUP / SCALPING ENTRY FIX
# ==================================================
trade.entry.max-auto-bumped-tp-multiple=6.00
trade.entry.reject-when-requested-tp-below-roundtrip-fee=false
trade.balance-snapshot-log-throttle-ms=300000
logging.level.com.chicu.aitradebot.market.MarketStreamServiceImpl=WARN
logging.level.com.chicu.aitradebot.market.stream.MarketDataStreamService=WARN
logging.level.com.chicu.aitradebot.exchange.bybit.BybitExchangeClient=WARN
logging.level.org.springframework.web.socket.config.WebSocketMessageBrokerStats=WARN
